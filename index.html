```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReadFlow – Smart Reading Assistant</title>

<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header class="rf-header">
<div class="rf-container">

<h1 class="rf-logo">
<i class="fa-solid fa-book-open"></i> ReadFlow
</h1>

<p class="rf-tagline">
An intelligent reading assistant designed to improve focus and comprehension
</p>

</div>
</header>


<main class="rf-container">

<section class="rf-card">

<h2>Reading Assistant</h2>

<p class="rf-description">
Paste your text below and let the assistant read it aloud while tracking your progress.
</p>


<textarea
id="textInput"
class="rf-textarea"
rows="6"
placeholder="Paste your text here..."
></textarea>


<div class="rf-controls">

<button id="btnRead" class="rf-btn rf-btn--green">
<i class="fa-solid fa-circle-play"></i> Read Aloud
</button>

<button id="btnPause" class="rf-btn rf-btn--amber" disabled>
<i class="fa-solid fa-circle-pause"></i> Pause
</button>

<button id="btnStop" class="rf-btn rf-btn--red" disabled>
<i class="fa-solid fa-circle-stop"></i> Stop
</button>

<button id="btnFocus" class="rf-btn rf-btn--outline">
<i class="fa-solid fa-eye-slash"></i> Focus Mode
</button>

<button id="btnClear" class="rf-btn rf-btn--ghost">
<i class="fa-solid fa-rotate-left"></i> Clear
</button>

</div>


<div class="rf-progress">

<div class="rf-progress-info">

<span id="progLabel">Progress</span>

<span id="progPct">0%</span>

</div>

<div id="progBar" class="rf-progress-bar">

<div id="progFill" class="rf-progress-fill"></div>

</div>

</div>


<div id="readDisplay" class="read-display"></div>

</section>

</main>


<footer class="rf-footer">

<p>
© 2026 ReadFlow 
</p>

</footer>


<script src="app.js"></script>

</body>
</html>
```
